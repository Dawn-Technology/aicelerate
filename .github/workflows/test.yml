name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only layer 1 runs in CI. Layers 2 and 3 (host smoke tests, plugin evals,
# behavioral runner) call a real agent CLI with authenticated access that the
# runners don't have — no Anthropic API key exists for this repo and the
# Copilot CLI needs an interactive login — so they run locally instead.
# Recipes per layer: tests/README.md.
jobs:
  # Free and deterministic: runs on every PR and merge, blocks on failure.
  checks:
    name: Structural + routing checks (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/structural/validate-plugin.mjs
      - run: node tests/triggers/run-triggers.mjs --min-rank1 90
